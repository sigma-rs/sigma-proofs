name: PR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# NOTE ON TOOLCHAIN SELECTION
#
# `rust-toolchain.toml` pins the channel, and a toolchain file outranks the
# `rustup default` that dtolnay/rust-toolchain sets. Any job that means to
# run on a channel other than the pinned one must therefore set
# RUSTUP_TOOLCHAIN, which outranks the toolchain file, or pass `+channel`
# explicitly. Without that the matrix silently collapses onto the pin.

jobs:
  typos:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo install cargo-sort --locked
      - run: cargo sort --check

  clippy:
    name: Clippy (${{ matrix.toolchain }}, ${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, nightly]
        features: [default, no-default, all]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - name: Run clippy
        run: |
          case "${{ matrix.features }}" in
            default)    cargo clippy --workspace --all-targets --locked -- -D warnings ;;
            no-default) cargo clippy --workspace --all-targets --locked --no-default-features -- -D warnings ;;
            all)        cargo clippy --workspace --all-targets --locked --all-features -- -D warnings ;;
          esac

  test:
    name: Test (${{ matrix.toolchain }}, ${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, nightly]
        features: [default, no-default, all]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Build
        run: |
          case "${{ matrix.features }}" in
            default)    cargo build --workspace --locked --verbose ;;
            no-default) cargo build --workspace --locked --no-default-features --verbose ;;
            all)        cargo build --workspace --locked --all-features --verbose ;;
          esac
      # The `no-default` leg skips doctests on purpose: every doctest shows the
      # API against a concrete curve, and no curve feature is enabled there.
      # What that leg exists to prove is that the crate builds and its unit
      # tests pass with no `std` and no group backend.
      - name: Test
        run: |
          case "${{ matrix.features }}" in
            default)    cargo test --workspace --locked --verbose --no-fail-fast ;;
            no-default) cargo test --workspace --locked --no-default-features --lib --tests --verbose --no-fail-fast ;;
            all)        cargo test --workspace --locked --all-features --verbose --no-fail-fast ;;
          esac

  # The version in `rust-version`, which is what downstreams actually resolve
  # against. Separate from the pinned toolchain on purpose: this job fails if
  # someone uses a newer language feature without raising the declared floor.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          version="$(grep -m1 '^rust-version = ' Cargo.toml | cut -d'"' -f2)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Build and test on the declared MSRV
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: |
          cargo build --workspace --locked --all-features --verbose
          cargo test --workspace --locked --all-features --no-fail-fast

  # Release codegen with the arithmetic and debug assertions that the dev
  # profile gets for free. Index and offset arithmetic in the constant-time
  # and MSM paths wraps silently in a normal release build; this makes it
  # abort instead, so the test suite can catch it.
  hardened:
    name: Overflow-checked release tests
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C overflow-checks=on -C debug-assertions=on"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked --all-features --release --no-fail-fast

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --workspace --all-features

  wasm:
    name: WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Build
        run: cargo build --workspace --locked --target wasm32-wasip1 --verbose
      - name: Test
        env:
          WASMTIME_BACKTRACE_DETAILS: "1"
          DUDECT_DUMP_SAMPLES: "1"
        run: cargo test --workspace --locked --target wasm32-wasip1 --verbose --no-fail-fast

  bench:
    name: Benchmark smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run benchmark
        run: cargo bench --bench msm --locked -- --sample-count 1 --sample-size 1

  # Build docs with the same flags docs.rs uses. Reduces risk of broken public docs.
  docs-rs:
    name: docs.rs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "--cfg docsrs -D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo +nightly doc --workspace --locked --all-features --no-deps

  # Anchor job for branch protection. Point required status checks at this.
  # see: https://github.com/orgs/community/discussions/26822
  status-check:
    if: always()
    needs:
      - typos
      - format
      - clippy
      - test
      - msrv
      - hardened
      - supply-chain
      - wasm
      - bench
      - docs-rs
    runs-on: ubuntu-latest
    steps:
      - name: Check all job results
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
